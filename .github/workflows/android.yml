name: Android checks

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify main and release snapshot
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^val releaseVersionNameDefault = "\([^"]*\)"$/\1/p' app/build.gradle.kts)"
          test "$(printf '%s\n' "$version" | grep -c '^[0-9][0-9.]*$')" = "1"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # verify-package.sh 的两处检查要 rg：装在后面等于打包校验先跑、先红（v1.3.1 首次打标签
      # 时暴露，exit 127）。装在用它的那一步之前。
      - name: Install ripgrep
        run: sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Test and package Scripting source
        run: |
          # 仓库里提交的 build-track.ts/script.json 常驻 formal（beta 只在本地临时切换、事后从
          # 备份还原），所以任何引用都按 formal 校验。原先非 tag 一律期望 beta，导致 main 与 PR
          # 必红而本地永远绿（2026-09-07 审计）。
          expected_track=formal
          test -f script/project/script.json
          test -f script/project/tools/test.sh
          test -f script/project/tools/package.sh
          test -f script/project/tools/verify-package.sh
          test -z "$(git ls-files 'Script/**')"
          sh script/project/tools/test.sh
          sh script/project/tools/package.sh "$RUNNER_TEMP/pipi-deliveries.scripting"
          sh script/project/tools/verify-package.sh "$RUNNER_TEMP/pipi-deliveries.scripting" "$expected_track"
          sh script/project/tools/verify-package.sh script/pipi-deliveries.scripting "$expected_track"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # assemble*Release 会触发 app/build.gradle.kts 里的 hasReleaseSigning 断言，所以这一步
      # 要拿到和 release-apk 同一套签名材料，否则任何 tag/main 构建都会停在
      # 「Release signing configuration is required for release builds」（v1.3.0 首次打标签时暴露）。
      - name: Restore release signing key for verification
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/deliveries-verify-signing"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/deliveries-verify-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/deliveries-verify-signing/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/deliveries-verify-signing/release.jks" \
            >> "$GITHUB_ENV"
      - name: Unit tests, lint and release build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :app:testStandardDebugUnitTest \
            :app:testCompatDebugUnitTest \
            :app:lintStandardDebug \
            :app:lintCompatDebug \
            :app:assembleStandardRelease \
            :app:assembleCompatRelease \
            --console=plain

  release-apk:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install ripgrep for packaging checks
        run: sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Restore release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/deliveries-signing"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deliveries-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/deliveries-signing/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/deliveries-signing/release.jks" >> "$GITHUB_ENV"
      - name: Set release metadata
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          else
            version_name="$(sed -n 's/^val releaseVersionNameDefault = "\([^"]*\)"$/\1/p' app/build.gradle.kts)"
          fi
          script_version_name="$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)",$/\1/p' script/project/script.json)"
          IFS=. read -r major minor patch <<< "$version_name"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          [[ "$script_version_name" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$minor" -lt 100
          test "$patch" -lt 100
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          # 正式版固定占 patch 段的第 99 号，与 build.sh / build.gradle.kts 同一套编号：
          # beta 用 01–98，正式版 99，这样任何 beta 都排在它将要成为的正式版之前
          # （用户定 2026-09-06）。原先用 GITHUB_RUN_ATTEMPT，会产出 1030001 这种低于
          # 本地正式包 1030099 的版本号，装不回已经装了正式版的机器。
          version_code=$((major * 1000000 + minor * 10000 + patch * 100 + 99))
          {
            echo "DELIVERIES_ARTIFACT_NAME=Pipi-Deliveries-${safe_ref}-${GITHUB_RUN_NUMBER}"
            echo "DELIVERIES_VERSION_CODE=$version_code"
            echo "DELIVERIES_VERSION_NAME=$version_name"
            echo "SCRIPT_VERSION_NAME=$script_version_name"
          } >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          ./gradlew \
            :app:testStandardDebugUnitTest \
            :app:testCompatDebugUnitTest \
            :app:lintStandardDebug \
            :app:lintCompatDebug \
            :app:assembleStandardRelease \
            :app:assembleCompatRelease \
            --console=plain
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/deliveries-signing/release.jks"
      - name: Prepare distribution files
        run: |
          release_dir="$RUNNER_TEMP/deliveries-release"
          release_tag="v${DELIVERIES_VERSION_NAME}"
          standard_apk="$release_dir/Pipi-Deliveries-${release_tag}.apk"
          compat_apk="$release_dir/Pipi-Deliveries-${release_tag}-Android10.apk"
          scripting_archive="$release_dir/Pipi-Deliveries-iOS-v${SCRIPT_VERSION_NAME}.scripting"
          install -d "$release_dir"
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "$standard_apk"
          cp app/build/outputs/apk/compat/release/app-compat-release.apk "$compat_apk"
          sh script/project/tools/package.sh "$scripting_archive"
          sh script/project/tools/verify-package.sh "$scripting_archive" formal
          {
            echo "RELEASE_APK_STANDARD=$standard_apk"
            echo "RELEASE_APK_COMPAT=$compat_apk"
            echo "RELEASE_SCRIPT=$scripting_archive"
          } >> "$GITHUB_ENV"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DELIVERIES_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/deliveries-release/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_APK_STANDARD" \
            "$RELEASE_APK_COMPAT" \
            "$RELEASE_SCRIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Pipi Deliveries $GITHUB_REF_NAME" \
            --generate-notes
      - name: Remove previous GitHub Releases and tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json tagName \
            --jq '.[].tagName' | while IFS= read -r old_tag; do
              if [ "$old_tag" != "$GITHUB_REF_NAME" ]; then
                gh release delete "$old_tag" \
                  --repo "$GITHUB_REPOSITORY" \
                  --cleanup-tag \
                  --yes
              fi
            done
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" \
            --jq '.[].ref' | while IFS= read -r old_ref; do
              old_tag="${old_ref#refs/tags/}"
              if [ "$old_tag" != "$GITHUB_REF_NAME" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/git/refs/tags/$old_tag"
              fi
            done
